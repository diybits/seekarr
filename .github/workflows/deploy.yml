name: Deploy

# Dispatches the Ansible deploy (diybits/infra
# deploy_seekarr.yml). release_version is the published image tag, without the
# leading v (e.g. 7.4.0); that version is what gets deployed.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Image tag/version to deploy (e.g. 7.4.0)'
        required: true
      environment:
        type: choice
        description: 'Environment to deploy to'
        required: true
        options:
          - homelab

env:
  DEPLOY_REPO_OWNER: diybits
  DEPLOY_REPO: infra
  DEPLOY_WORKFLOW_ID: deploy_seekarr.yml
  DEPLOY_REPO_BRANCH: main

jobs:
  trigger_deployment:
    name: Trigger Deployment to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # Short-lived token that can only run workflows in diybits/infra,
      # from the dispatch GitHub App.
      - name: Get dispatch token for ${{ env.DEPLOY_REPO_OWNER }}/${{ env.DEPLOY_REPO }}
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPLOY_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_DISPATCH_APP_KEY }}
          owner: ${{ env.DEPLOY_REPO_OWNER }}
          repositories: ${{ env.DEPLOY_REPO }}
          permission-actions: write

      - name: Trigger Ansible ${{ github.event.inputs.environment }} Deployment for ${{ github.event.inputs.release_version }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: '${{ env.DEPLOY_REPO_OWNER }}',
              repo: '${{ env.DEPLOY_REPO }}',
              workflow_id: '${{ env.DEPLOY_WORKFLOW_ID }}',
              ref: '${{ env.DEPLOY_REPO_BRANCH }}',
              inputs: {
                release_version: '${{ github.event.inputs.release_version }}',
                environment: '${{ github.event.inputs.environment }}',
                triggering_actor: '${{ github.actor }}'
              }
            })
